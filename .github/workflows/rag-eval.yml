name: RAG Eval Gate

on:
  pull_request:
    paths:
      - 'backend/src/rag/**'
      - 'backend/src/tasks/**'
      - 'backend/tests/eval/**'
  workflow_dispatch:

jobs:
  eval:
    name: RAG Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run RAG eval
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/ragbase
          EMBEDDING_MODEL: ${{ secrets.EVAL_EMBEDDING_MODEL }}
          EMBEDDING_API_KEY: ${{ secrets.EVAL_EMBEDDING_API_KEY }}
          LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
        run: |
          cd backend
          python -m scripts.eval_rag \
            --recall-fail-below 0.6 \
            --mrr-fail-below 0.4 \
            --faithfulness-fail-below 0.7 \
            --answer-relevancy-fail-below 0.6 \
            | tee eval_results.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval_results*.json
          retention-days: 30
