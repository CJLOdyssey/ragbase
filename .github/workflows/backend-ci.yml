# Backend CI — lint / typecheck / test with coverage (SPEC 4.2).
# GitHub Flow: push to develop/main triggers; feature branches run CI via
# pull_request. paths whitelist keeps docs-only
# and frontend-only changes from burning runner time.
name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token (OpenSSF Scorecard Token-Permissions / GitHub hardening).
permissions:
  contents: read

jobs:
  backend-lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --group dev --group test
      - name: Lint
        run: uv run ruff check backend/
      - name: Typecheck
        run: uv run mypy backend/src --strict --explicit-package-bases
      # fail_under=89 enforced by [tool.coverage.report] in pyproject.toml
      - name: Test with coverage
        run: uv run pytest --cov=backend --cov-report=term-missing -m "not integration and not benchmark"

  # Retrieval quality gate (Q2/Q4): golden-set recall/MRR + negative precision.
  # Needs GitHub secrets EMBEDDING_API_KEY / RERANK_API_KEY (SiliconFlow,
  # BAAI/bge-m3 + bge-reranker-v2-m3) — set them in repo settings. Secrets
  # cannot appear in job-level `if` (workflow fails to parse), so the eval
  # step gates on a job env mapping instead: skips cleanly until both secrets
  # exist, then activates automatically (deployment placeholder).
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_RAG_KEYS: ${{ secrets.EMBEDDING_API_KEY != '' && secrets.RERANK_API_KEY != '' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragbase
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --group dev --group test
      - name: Migrate schema to head
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5433/ragbase
        run: PYTHONPATH=backend/src uv run python -m alembic -c alembic.ini upgrade head
      - name: Retrieval eval gate (bge-m3 embed + rerank)
        if: env.HAS_RAG_KEYS == 'true'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/ragbase
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
        run: |
          uv run python backend/scripts/eval_rag.py --corpus backend/tests/eval/corpus/SPEC.md \
            --golden backend/tests/eval/golden_qa.json --rerank \
            --recall-fail-below 0.97 --mrr-fail-below 0.9 --negative-fail-below 0.65

  # Dependency vulnerability audit + Python SAST (uv audit covers the lockfile;
  # bandit scans backend/ for Python security issues).
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --group dev --group test
      - name: Dependency audit (uv audit)
        run: uv audit
      - name: SAST (bandit)
        run: uv run bandit -c pyproject.toml -r backend/ -ll

  # Secret scanning — any code change may introduce credentials.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Container config scan — Dockerfiles are build-inputs for deployments.
  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan docker/Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: docker/Dockerfile
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Scan frontend/Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: frontend/Dockerfile
          severity: CRITICAL,HIGH
          exit-code: 1
