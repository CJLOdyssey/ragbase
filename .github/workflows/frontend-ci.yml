# Frontend CI — typecheck / lint / unit tests / build.
# GitHub Flow triggers (main/develop push + PR); frontend/** path whitelist.
name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token (OpenSSF Scorecard Token-Permissions / GitHub hardening).
permissions:
  contents: read

jobs:
  frontend-lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint
      - name: Audit (npm audit)
        run: npm audit --audit-level=high

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Unit tests (vitest)
        run: npx vitest run

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Build (tsc -b && vite build)
        run: npm run build
