<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Glowing radial for ambient light -->
    <radialGradient id="glow1" cx="55%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <!-- Glass morphism filters -->
    <filter id="blur-sm">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
    <filter id="blur-md">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Ambient light -->
  <rect width="512" height="512" rx="112" fill="url(#glow1)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow2)"/>

  <!-- ═══ Database: solid cylinder with glass highlight ═══ -->
  <g transform="translate(115, 330)">
    <!-- Shadow -->
    <ellipse cx="5" cy="8" rx="72" ry="20" fill="#000" opacity="0.3" filter="url(#blur-md)"/>
    <!-- Body -->
    <path d="M-72,-20 v-55 a72,20 0 0 0 144,0 v55" fill="#0e4f5c" opacity="0.7"/>
    <path d="M-72,-20 v-55 a72,20 0 0 0 144,0 v55" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.6"/>
    <!-- Top ellipse -->
    <ellipse cx="0" cy="-75" rx="72" ry="20" fill="#164e63" opacity="0.8"/>
    <ellipse cx="0" cy="-75" rx="72" ry="20" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.7"/>
    <!-- Glass reflection -->
    <ellipse cx="-20" cy="-80" rx="30" ry="8" fill="#fff" opacity="0.12"/>
    <!-- Ring -->
    <ellipse cx="0" cy="-45" rx="72" ry="20" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- ═══ Vector network: glowing nodes on glass panel ═══ -->
  <g>
    <!-- Glass panel behind network -->
    <rect x="140" y="90" width="260" height="220" rx="20" fill="#fff" opacity="0.04"/>
    <rect x="140" y="90" width="260" height="220" rx="20" fill="none" stroke="#fff" stroke-width="1" opacity="0.08"/>

    <!-- Connections with glow -->
    <g stroke="#34d399" stroke-width="2.5" opacity="0.5" filter="url(#blur-sm)">
      <line x1="220" y1="145" x2="315" y2="120"/>
      <line x1="220" y1="145" x2="295" y2="205"/>
      <line x1="315" y1="120" x2="360" y2="190"/>
      <line x1="295" y1="205" x2="360" y2="190"/>
      <line x1="295" y1="205" x2="255" y2="280"/>
      <line x1="190" y1="235" x2="255" y2="280"/>
      <line x1="190" y1="235" x2="165" y2="180"/>
      <line x1="165" y1="180" x2="220" y2="145"/>
    </g>
    <!-- Solid connections -->
    <g stroke="#34d399" stroke-width="2" opacity="0.6">
      <line x1="220" y1="145" x2="315" y2="120"/>
      <line x1="220" y1="145" x2="295" y2="205"/>
      <line x1="315" y1="120" x2="360" y2="190"/>
      <line x1="295" y1="205" x2="360" y2="190"/>
      <line x1="295" y1="205" x2="255" y2="280"/>
      <line x1="190" y1="235" x2="255" y2="280"/>
      <line x1="190" y1="235" x2="165" y2="180"/>
      <line x1="165" y1="180" x2="220" y2="145"/>
    </g>

    <!-- Nodes: solid spheres with specular highlight -->
    <g>
      <circle cx="220" cy="145" r="14" fill="#065f46" opacity="0.9"/>
      <circle cx="220" cy="145" r="14" fill="none" stroke="#34d399" stroke-width="2"/>
      <circle cx="216" cy="140" r="5" fill="#fff" opacity="0.25"/>

      <circle cx="315" cy="120" r="11" fill="#065f46" opacity="0.8"/>
      <circle cx="315" cy="120" r="11" fill="none" stroke="#34d399" stroke-width="2"/>
      <circle cx="312" cy="116" r="4" fill="#fff" opacity="0.2"/>

      <circle cx="295" cy="205" r="17" fill="#065f46" opacity="0.95"/>
      <circle cx="295" cy="205" r="17" fill="none" stroke="#34d399" stroke-width="2.5"/>
      <circle cx="290" cy="199" r="6" fill="#fff" opacity="0.3"/>
      <!-- Highlight ring: the "hit" node -->
      <circle cx="295" cy="205" r="25" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.4"/>
      <circle cx="295" cy="205" r="33" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.2"/>

      <circle cx="190" cy="235" r="12" fill="#065f46" opacity="0.85"/>
      <circle cx="190" cy="235" r="12" fill="none" stroke="#34d399" stroke-width="2"/>
      <circle cx="187" cy="231" r="4" fill="#fff" opacity="0.2"/>

      <circle cx="360" cy="190" r="9" fill="#065f46" opacity="0.7"/>
      <circle cx="360" cy="190" r="9" fill="none" stroke="#34d399" stroke-width="1.5"/>

      <circle cx="255" cy="280" r="13" fill="#065f46" opacity="0.8"/>
      <circle cx="255" cy="280" r="13" fill="none" stroke="#34d399" stroke-width="2"/>

      <circle cx="165" cy="180" r="10" fill="#065f46" opacity="0.75"/>
      <circle cx="165" cy="180" r="10" fill="none" stroke="#34d399" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ═══ Search: solid magnifying glass with glass lens ═══ -->
  <g transform="translate(385, 365)">
    <!-- Shadow -->
    <circle cx="5" cy="5" r="48" fill="#000" opacity="0.25" filter="url(#blur-md)"/>
    <!-- Handle -->
    <line x1="35" y1="35" x2="72" y2="72" stroke="#92400e" stroke-width="10" stroke-linecap="round"/>
    <line x1="35" y1="35" x2="72" y2="72" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <!-- Ring -->
    <circle cx="0" cy="0" r="46" fill="#78350f" opacity="0.6"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#fbbf24" stroke-width="5"/>
    <!-- Glass lens -->
    <circle cx="0" cy="0" r="36" fill="#1e293b" opacity="0.5"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.3"/>
    <!-- Lens reflection -->
    <ellipse cx="-10" cy="-12" rx="16" ry="10" fill="#fff" opacity="0.1" transform="rotate(-20)"/>
  </g>

  <!-- ═══ AI spark: solid star with glow ═══ -->
  <g transform="translate(418, 95)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="28" fill="#f43f5e" opacity="0.15" filter="url(#blur-md)"/>
    <!-- Star body -->
    <path d="M0,-22 L6,-8 L22,-8 L9,2 L14,18 L0,9 L-14,18 L-9,2 L-22,-8 L-6,-8 Z" fill="#be123c" opacity="0.9"/>
    <path d="M0,-22 L6,-8 L22,-8 L9,2 L14,18 L0,9 L-14,18 L-9,2 L-22,-8 L-6,-8 Z" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    <!-- Specular -->
    <circle cx="-3" cy="-8" r="4" fill="#fff" opacity="0.3"/>
  </g>
  <!-- Small spark -->
  <g transform="translate(448, 138) scale(0.5)">
    <path d="M0,-22 L6,-8 L22,-8 L9,2 L14,18 L0,9 L-14,18 L-9,2 L-22,-8 L-6,-8 Z" fill="#9f1239" opacity="0.6"/>
    <path d="M0,-22 L6,-8 L22,-8 L9,2 L14,18 L0,9 L-14,18 L-9,2 L-22,-8 L-6,-8 Z" fill="none" stroke="#fb7185" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- ═══ Query tokens: floating solid spheres ═══ -->
  <circle cx="175" cy="415" r="9" fill="#4c1d95" opacity="0.7"/>
  <circle cx="175" cy="415" r="9" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>
  <circle cx="173" cy="412" r="3" fill="#fff" opacity="0.2"/>
  <circle cx="155" cy="440" r="6" fill="#4c1d95" opacity="0.5"/>
  <circle cx="155" cy="440" r="6" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
</svg>
