<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="var(--color-surface, #0f1117)" />
    <meta name="description" content="RagBase - 企业级 RAG 知识库问答平台" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RagBase" />
    <!-- TODO: iOS Safari 不支持 SVG 作为 apple-touch-icon，需要提供 180x180 PNG 图标 -->
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="/api" />
    <link rel="dns-prefetch" href="/api" />
    <link rel="stylesheet" href="/src/styles/tailwind-entry.css" />
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="preload" as="font" crossorigin href="/node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2" />
    <link rel="preload" as="font" crossorigin href="/node_modules/geist/dist/fonts/geist-sans/Geist-Italic.woff2" />
    <link rel="modulepreload" href="/src/App.tsx" />
    <script>
      (function(){
        try {
          var s = JSON.parse(localStorage.getItem('ragbase-settings'));
          var theme = s && s.theme ? s.theme : 'dark';
          if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e){}
      })();
    </script>
    <!-- Prevent layout shift: define sizing vars before CSS loads. Values match tailwind-entry.css. -->
    <style>
      html { background: #f5f5f7; }
      html.dark { background: #0f1117; }
      :root { --da-sidebar-width: clamp(17.5rem, 18vw, 20rem); --da-input-height: 56px; --da-input-radius: 16px; --da-toolbar-height: 48px; --modal-m: 560px; }
    </style>
    <title>RagBase</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
