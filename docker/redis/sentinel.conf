# Redis Sentinel configuration for ragbase-redis
#
# Auth (requirepass / auth-pass) is appended at container startup by the
# entrypoint.sh script when REDIS_PASSWORD is set.

# ---------------------------------------------------------------------------
# Monitor configuration
# ---------------------------------------------------------------------------
sentinel monitor ragbase-redis redis-master 6379 2
sentinel down-after-milliseconds ragbase-redis 5000
sentinel failover-timeout ragbase-redis 10000
sentinel parallel-syncs ragbase-redis 1

# ---------------------------------------------------------------------------
# Sentinel behaviour
# ---------------------------------------------------------------------------
sentinel resolve-hostnames no
sentinel announce-hostnames no

# Log to stdout so Docker captures it
logfile ""
