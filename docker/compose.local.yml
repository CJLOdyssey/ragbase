# ── 本地开发 compose（overlay）───────────────────────────────────────────
# 用法：docker compose -f docker/compose.base.yml -f docker/compose.local.yml up -d
# 差异：端口全暴露（5433/6380/8080/5173）、弱密钥默认、build args、本地镜像名。
# 端口避开外部项目共享实例（5432/6379）——内容库/缓存完全独立。
# ─────────────────────────────────────────────────────────────────────────

include:
  - compose.base.yml

services:
  postgres:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"

  backend:
    image: ragbase/backend:latest
    ports:
      - "8080:8080"

  frontend:
    image: ragbase/frontend:latest
    ports:
      - "5173:8080"
