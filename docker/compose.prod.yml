# ── 生产部署 compose（overlay）───────────────────────────────────────────
# 用法：docker compose -f docker/compose.base.yml -f docker/compose.prod.yml up -d
# 差异：ACR 镜像 tag、密钥必填、celery 生产化（RUN_DISPATCH/SKIP_MIGRATIONS）、
#       日志轮转、独立子网、DB NullPool（celery 跨 loop 安全）、独立 project
#       名与卷（与 local 数据隔离）。
# ─────────────────────────────────────────────────────────────────────────

name: content-studio-prod

include:
  - compose.base.yml

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  postgres:
    container_name: content-studio-db-prod
    <<: *restart-policy
    logging: *default-logging
    environment:
      POSTGRES_DB: content_studio
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env for production}

  redis:
    container_name: content-studio-redis-prod
    <<: *restart-policy
    logging: *default-logging

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: crpi-j0fhvkobexa3ilkn.cn-shenzhen.personal.cr.aliyuncs.com/content-studio/backend:latest
    container_name: content-studio-api-prod
    <<: *restart-policy
    logging: *default-logging
    environment:
      # include 深合并进 base 的 x-common-env（anchor 不跨文件，只写差异）
      RUN_DISPATCH: celery
      # 初始 admin 密码（首次 seed 生效）——生产必须显式设置
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set in .env for production}
      # celery threads-pool 每次任务新建 event loop：QueuePool 连接池跨 loop 会
      # 抛 "Future attached to a different loop"。NullPool 每次新连接，规避。
      DATABASE_POOL_SIZE: "0"
    healthcheck:
      test: ["CMD", "python3", "scripts/health.py", "--port", "8080"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: crpi-j0fhvkobexa3ilkn.cn-shenzhen.personal.cr.aliyuncs.com/content-studio/backend:latest
    container_name: content-studio-worker-prod
    <<: *restart-policy
    logging: *default-logging
    environment:
      # 迁移只由 backend 执行（P13）；celery 跳过，避免并发 alembic 竞争
      SKIP_MIGRATIONS: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONFAULTHANDLER_ALL_THREADS: "1"
      DATABASE_POOL_SIZE: "0"
    healthcheck:
      test: ["CMD-SHELL", "celery -A broker inspect ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: crpi-j0fhvkobexa3ilkn.cn-shenzhen.personal.cr.aliyuncs.com/content-studio/frontend:latest
    container_name: content-studio-frontend-prod
    <<: *restart-policy
    logging: *default-logging
    ports:
      - "5173:8080"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # 用 127.0.0.1 而非 localhost：nginx 只监听 IPv4，wget 解析 localhost 到
      # ::1 会 Connection refused（本机 IPv6 黑洞，见 AGENTS.md）
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: content-studio-prod
    driver: bridge
    ipam:
      config:
        - subnet: "172.28.0.0/16"
